spring.application.name=DriveCare

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/drivecare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=cdac
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security (set JWT_SECRET as an environment variable before production deployment)
jwt.secret=${JWT_SECRET:DriveCareDevelopmentJwtSecretKeyMustBeAtLeast32Chars}
jwt.expiration-ms=36000000
